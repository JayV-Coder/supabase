# Confere as migrations de um PR antes do merge, para o deploy do main não
# quebrar depois:
#   - dois arquivos com o mesmo carimbo de data (threads em paralelo) são
#     rejeitados pelo `db push`;
#   - `db push --dry-run` contra o projeto mostra o que o merge vai aplicar e
#     falha se uma migration nova ficou com data anterior à última já aplicada;
#   - os testes pgTAP de `tests/` rodam num Postgres local com todas as
#     migrations aplicadas do zero.
#
# Usa os mesmos segredos do deploy; sem eles (PR de fork), só a primeira
# conferência roda.
name: Conferir migrations

on:
  pull_request:
    paths:
      - "migrations/**"
      - "tests/**"
      - "config.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    name: Migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_CLI_VERSION: 2.119.0
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: supabase

      - name: Carimbos de data únicos
        run: |
          dup=$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Migrations com o mesmo carimbo de data: $dup"
            exit 1
          fi

      # Migration do Doctor é a que tem `_doctor_` logo depois do carimbo: só ela
      # mexe no schema `doctor`, e é ela que o deploy deixa fora do `db push`. Uma
      # que mexe no schema sem ter o nome iria para o `db push`.
      - name: Nomes das migrations do Doctor
        run: |
          bad=""
          for file in supabase/migrations/*.sql; do
            name=$(basename "$file")
            if echo "$name" | grep -qE '^[0-9]+_doctor_'; then continue; fi
            if grep -qiE '\b(schema|table|function|procedure|view|index|trigger|into|from|update|join|on)[[:space:]]+(if[[:space:]]+(not[[:space:]]+)?exists[[:space:]]+)?doctor\b' "$file"; then
              bad="$bad $name"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Mexem no schema doctor sem o nome <carimbo>_doctor_<nome>.sql:$bad"
            exit 1
          fi

      # Baixa a CLI direto do release, sem ação de terceiros.
      - name: Instalar a Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin supabase supabase-go
          supabase --version

      # Igual ao deploy: as migrations do Doctor não passam pelo `db push`.
      - name: Simular o deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          mkdir -p "$RUNNER_TEMP/doctor-migrations"
          for file in supabase/migrations/*.sql; do
            if basename "$file" | grep -qE '^[0-9]+_doctor_'; then mv "$file" "$RUNNER_TEMP/doctor-migrations/"; fi
          done
          supabase link --project-ref "$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml)"
          supabase db push --linked --dry-run

  tests:
    name: Testes pgTAP
    runs-on: ubuntu-latest
    env:
      SUPABASE_CLI_VERSION: 2.119.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: supabase

      - name: Instalar a Supabase CLI
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin supabase supabase-go
          supabase --version

      # Só o banco: as migrations sobem do zero, como num projeto novo.
      - name: Subir o banco local
        run: supabase db start

      - name: Rodar os testes
        run: supabase test db
