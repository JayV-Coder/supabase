# Só o que o projeto remoto precisa saber daqui: o vínculo e a função `jev`,
# que confere o token sozinha (`auth.getClaims`) porque o projeto assina com
# ES256 e o portão legado da plataforma só entende HS256.
project_id = "exvsozyemolrjbjetqww"

[functions.jev]
verify_jwt = false

# O pagamento confere o token sozinho, como o `jev`, e atende sem token a
# volta do navegador (`?return=`), que só redireciona para o app.
[functions.billing]
verify_jwt = false

# O Stripe não manda JWT: a função confere a assinatura do evento.
[functions.stripe-webhook]
verify_jwt = false
